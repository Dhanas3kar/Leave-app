services:
  - type: web
    name: leave-app
    env: node
    buildCommand: npm install && npx prisma db push && npm run build
    startCommand: npm start
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: "file:/data/sqlite.db"
      - key: JWT_SECRET
        generateValue: true
